<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrazione – Ham Radio Logbook</title>
  <link rel="icon" href="/static/icons/icon-192.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1a3a5c 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .register-card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      color: #e8ecef;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .brand-logo {
      font-size: 2.4rem;
      color: #f0b429;
      text-align: center;
      margin-bottom: 0.25rem;
    }
    .brand-title {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: #f0b429;
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
    }
    .brand-sub {
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 1.8rem;
    }
    .form-label { color: #94a3b8; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.3rem; }
    .form-control {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e8ecef;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
    }
    .form-control:focus {
      background: rgba(255,255,255,0.12);
      border-color: #f0b429;
      color: #e8ecef;
      box-shadow: 0 0 0 3px rgba(240,180,41,0.15);
    }
    .form-control::placeholder { color: #64748b; }
    .input-group .btn-outline-secondary {
      border-color: rgba(255,255,255,0.15);
      color: #94a3b8;
      background: rgba(255,255,255,0.05);
    }
    .input-group .btn-outline-secondary:hover { background: rgba(255,255,255,0.12); color: #e8ecef; }
    .btn-register {
      background: linear-gradient(90deg, #f0b429, #e6960f);
      border: none;
      color: #0d1b2a;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 8px;
      padding: 0.7rem;
      width: 100%;
      margin-top: 0.5rem;
      transition: opacity 0.2s;
    }
    .btn-register:hover { opacity: 0.9; color: #0d1b2a; }
    .btn-register:disabled { opacity: 0.6; }
    .alert-error {
      background: rgba(220,53,69,0.15);
      border: 1px solid rgba(220,53,69,0.4);
      color: #f87171;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font-size: 0.875rem;
      display: none;
    }
    .alert-success {
      background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.4);
      color: #4ade80;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font-size: 0.875rem;
      display: none;
    }
    .login-link { text-align: center; font-size: 0.875rem; color: #94a3b8; margin-top: 1.2rem; }
    .login-link a { color: #f0b429; text-decoration: none; font-weight: 600; }
    .login-link a:hover { text-decoration: underline; }
    .field-hint { font-size: 0.75rem; color: #64748b; margin-top: 0.2rem; }
    .section-divider { border-color: rgba(255,255,255,0.1); margin: 1.2rem 0; }
    footer { color: #475569; font-size: 0.75rem; text-align: center; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="register-card">
    <div class="brand-logo"><i class="bi bi-broadcast"></i></div>
    <div class="brand-title">HAM RADIO LOGBOOK</div>
    <div class="brand-sub">Crea il tuo account</div>

    <div id="error-msg" class="alert-error mb-3"></div>
    <div id="success-msg" class="alert-success mb-3"></div>

    <form id="register-form" novalidate>

      <div class="mb-3">
        <label class="form-label" for="username">Nominativo (Callsign) *</label>
        <input type="text" id="username" name="username" class="form-control"
               placeholder="es. IU8VBG" autocomplete="username"
               style="text-transform:uppercase" required minlength="3">
        <div class="field-hint">Il tuo nominativo radioamatoriale</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="full_name">Nome e Cognome</label>
        <input type="text" id="full_name" name="full_name" class="form-control"
               placeholder="es. Mario Rossi" autocomplete="name">
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="es. mario@esempio.it" autocomplete="email">
      </div>

      <hr class="section-divider">

      <div class="mb-3">
        <label class="form-label" for="password">Password *</label>
        <div class="input-group">
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="Almeno 8 caratteri" autocomplete="new-password" required minlength="8">
          <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('password','eye1')">
            <i id="eye1" class="bi bi-eye"></i>
          </button>
        </div>
        <div class="field-hint">Minimo 8 caratteri</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="confirm">Conferma Password *</label>
        <div class="input-group">
          <input type="password" id="confirm" name="confirm" class="form-control"
                 placeholder="Ripeti la password" autocomplete="new-password" required>
          <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('confirm','eye2')">
            <i id="eye2" class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-register" id="submit-btn">
        <span id="submit-text"><i class="bi bi-person-plus-fill me-2"></i>Registrati</span>
        <span id="submit-spinner" class="d-none">
          <span class="spinner-border spinner-border-sm me-2"></span>Registrazione...
        </span>
      </button>
    </form>

    <div class="login-link">
      Hai già un account? <a href="/login">Accedi qui</a>
    </div>
  </div>

  <footer>
    &copy; <span id="yr"></span> IU8VBG – Ham Radio Logbook
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    function togglePwd(inputId, iconId) {
      const inp = document.getElementById(inputId);
      const ico = document.getElementById(iconId);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      ico.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    }

    // Auto-uppercase callsign
    document.getElementById('username').addEventListener('input', function() {
      const pos = this.selectionStart;
      this.value = this.value.toUpperCase();
      this.setSelectionRange(pos, pos);
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errDiv  = document.getElementById('error-msg');
      const okDiv   = document.getElementById('success-msg');
      const btn     = document.getElementById('submit-btn');
      const btnText = document.getElementById('submit-text');
      const spinner = document.getElementById('submit-spinner');

      errDiv.style.display = 'none';
      okDiv.style.display  = 'none';

      const username  = document.getElementById('username').value.trim().toUpperCase();
      const password  = document.getElementById('password').value;
      const confirm   = document.getElementById('confirm').value;
      const email     = document.getElementById('email').value.trim();
      const full_name = document.getElementById('full_name').value.trim();

      if (!username || !password) {
        errDiv.textContent = 'Nominativo e password sono obbligatori.';
        errDiv.style.display = 'block';
        return;
      }
      if (password.length < 8) {
        errDiv.textContent = 'La password deve avere almeno 8 caratteri.';
        errDiv.style.display = 'block';
        return;
      }
      if (password !== confirm) {
        errDiv.textContent = 'Le password non corrispondono.';
        errDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btnText.classList.add('d-none');
      spinner.classList.remove('d-none');

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, confirm, email, full_name }),
        });
        const json = await res.json();
        if (json.ok) {
          okDiv.textContent = `Registrazione completata! Benvenuto, ${json.username}. Reindirizzamento...`;
          okDiv.style.display = 'block';
          setTimeout(() => { window.location.href = '/'; }, 1200);
        } else {
          errDiv.textContent = json.error || 'Errore durante la registrazione.';
          errDiv.style.display = 'block';
        }
      } catch {
        errDiv.textContent = 'Errore di connessione. Riprova.';
        errDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btnText.classList.remove('d-none');
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
